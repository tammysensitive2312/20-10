<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vườn Sen Tặng Chị</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Lời chúc 20/10 tặng chị: một khu vườn 3D lúc hoàng hôn với hồ sen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&family=Dancing+Script:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D garden at golden hour; letter card bottom-left, polaroid pinned top-right. Single warm-dusk look by choice. */
:root{
  --dusk:#1e1420;
  --amber:#f4a640;
  --amber-ink:#2a160e;
  --coral:#ff8a6b;
  --gold:#ffd27a;
  --cream:#fff6ec;
  --muted:#ead2c4;
  --paper:#fffaf2;
  --ink:#6b3a1e;
  --glass:rgba(46,24,30,.62);
  --line:rgba(255,214,180,.3);
  --f-display:"Fraunces","Iowan Old Style","Times New Roman",serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hand:"Dancing Script","Segoe Script","Brush Script MT",cursive;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--dusk);color:var(--cream);font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#scene.dragging{cursor:grabbing}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

.ui{position:fixed;inset:0;z-index:2;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto;gap:12px;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ui>*{min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hint{margin:0;font-size:12px;letter-spacing:.02em;color:var(--muted);background:rgba(30,20,32,.45);border:1px solid var(--line);
  padding:7px 13px;border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:opacity .8s;opacity:0}
.hint.show{opacity:1}
.hint-short{display:none}
.icon-btn{pointer-events:auto;white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:8px;font:500 13px/1 var(--f-body);color:var(--cream);
  background:rgba(30,20,32,.5);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:background .2s}
.icon-btn:hover{background:rgba(255,214,180,.16)}
.icon-btn svg{width:16px;height:16px}
.middle{display:flex;justify-content:flex-end;align-items:flex-start;min-height:0}

.polaroid{pointer-events:auto;margin:0;width:clamp(120px,15vw,186px);background:var(--paper);padding:10px 10px 0;border-radius:3px;
  transform:rotate(-3deg);box-shadow:0 18px 40px rgba(40,10,0,.4);color:var(--ink);opacity:0;transition:opacity 1s .4s, transform 1s .4s}
.polaroid.show{opacity:1}
.polaroid:hover{transform:rotate(-1deg) scale(1.03)}
.photo-frame{display:block;aspect-ratio:4/5;max-width:100%;background:#f4e6d6;overflow:hidden;cursor:pointer;position:relative}
.photo-frame img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.photo-empty{position:absolute;inset:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-size:12px;font-weight:500;color:var(--ink);border:1.5px dashed #d8b48e;text-align:center;padding:4px}
.photo-empty svg{width:22px;height:22px}
.polaroid figcaption{font-family:var(--f-hand);font-weight:700;font-size:clamp(16px,1.5vw,20px);text-align:center;padding:7px 0 9px;color:var(--ink)}

.card{pointer-events:auto;align-self:end;width:min(440px,100%);box-sizing:border-box;max-height:min(58vh,560px);overflow:auto;
  background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:22px 24px 18px;
  backdrop-filter:blur(14px) saturate(1.15);-webkit-backdrop-filter:blur(14px) saturate(1.15);box-shadow:0 20px 60px rgba(30,8,0,.4);
  opacity:0;transform:translateY(18px);visibility:hidden;transition:opacity 1s ease,transform 1s ease,visibility 1s}
.card.show{opacity:1;transform:none;visibility:visible}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--gold);margin:0 0 10px;font-weight:500}
.card-to{font-family:var(--f-hand);font-weight:700;font-size:clamp(30px,3vw,40px);line-height:1.15;margin:0 0 10px;color:var(--cream);text-wrap:balance}
.card-msg{font-family:var(--f-display);font-size:clamp(17px,1.5vw,20px);font-weight:400;line-height:1.55;margin:0 0 10px;white-space:pre-line;color:var(--cream)}
.card-msg .rest{color:transparent}
.card-from{font-family:var(--f-hand);font-size:24px;text-align:right;margin:0 0 16px;color:var(--gold)}
.card-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:500 13px/1 var(--f-body);padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,214,180,.08);
  color:var(--cream);cursor:pointer;transition:background .2s,transform .2s}
.btn:hover{background:rgba(255,214,180,.18)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--amber);border-color:transparent;color:var(--amber-ink);font-weight:600;box-shadow:0 8px 24px rgba(244,166,64,.35)}
.btn.primary:hover{background:#f7b55a}
.btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.polaroid:focus-within{outline:2px solid var(--gold);outline-offset:3px}

.intro{position:fixed;inset:0;z-index:5;display:grid;place-items:center;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;
  background:radial-gradient(ellipse at 50% 50%,rgba(30,20,32,.2),rgba(30,20,32,.8) 72%);transition:opacity 1.4s ease,visibility 1.4s}
.intro.gone{opacity:0;visibility:hidden;pointer-events:none}
.intro-inner{max-width:560px;animation:rise 1.4s ease both}
.big-date{font-family:var(--f-display);font-weight:600;font-size:clamp(96px,22vw,210px);line-height:.9;margin:6px 0 0;letter-spacing:-.03em;
  background:linear-gradient(180deg,var(--cream) 10%,var(--gold) 55%,var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
.big-date .dot{font-style:italic;padding:0 .03em}
.intro-to{font-family:var(--f-hand);font-weight:700;font-size:clamp(28px,4vw,40px);margin:14px 0 6px;color:var(--cream)}
.intro-line{font-family:var(--f-display);font-style:italic;font-size:clamp(18px,2.1vw,22px);color:var(--muted);margin:0 0 28px;text-wrap:balance}
.intro-note{font-size:12px;color:var(--muted);margin:16px 0 0}
#openBtn{font-size:15px;padding:15px 34px;letter-spacing:.02em}
@keyframes rise{from{transform:translateY(14px);opacity:.001}to{transform:none;opacity:1}}
.fallback{position:fixed;top:50%;left:0;right:0;text-align:center;color:var(--muted);z-index:1;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

@media (max-width:640px){
  .card{width:100%;max-height:44vh;padding:16px 18px 14px;border-radius:16px}
  .card-to{font-size:30px}
  .card-msg{font-size:16.5px}
  .polaroid{width:104px;padding:6px 6px 0}
  .polaroid figcaption{font-size:14px;padding:4px 0 6px}
  .hint{font-size:11px;padding:6px 10px}
  .hint-long{display:none}
  .hint-short{display:inline}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>


<canvas id="scene" aria-label="Khu vườn 3D lúc hoàng hôn với hồ sen. Kéo để xoay, cuộn để phóng to."></canvas>
<p class="fallback" id="fallback" hidden>Trình duyệt này chưa hiển thị được 3D, nhưng lời chúc vẫn ở đây.</p>

<div class="ui">
  <header class="topbar">
    <p class="hint" id="hint"><span class="hint-long">Kéo để xoay khu vườn · cuộn để phóng to</span><span class="hint-short">Kéo để xoay · chụm để phóng to</span></p>
    <button class="icon-btn" id="soundBtn" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      <span id="soundLabel">Nhạc: tắt</span>
    </button>
  </header>

  <div class="middle">
    <figure class="polaroid" id="polaroid">
      <label for="photoInput" class="photo-frame" title="Chọn ảnh">
        <img id="photoImg" alt="Ảnh của chị" hidden>
        <span class="photo-empty" id="photoEmpty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
          <span>Thêm ảnh của chị</span>
        </span>
      </label>
      <input type="file" id="photoInput" accept="image/*" class="sr-only">
      <figcaption>20 · 10 · 2026</figcaption>
    </figure>
  </div>

  <article class="card" id="card" aria-live="polite">
    <p class="eyebrow">Ngày Phụ nữ Việt Nam · 20 tháng 10</p>
    <h1 class="card-to" id="cardTo">Gửi chị,</h1>
    <p class="card-msg" id="cardMsg"><span class="typed"></span><span class="rest"></span></p>
    <p class="card-from" id="cardFrom"></p>
    <div class="card-actions">
      <button class="btn primary" id="replayBtn" type="button">Tặng hoa lần nữa</button>
    </div>
  </article>
</div>

<div class="intro" id="intro">
  <div class="intro-inner">
    <p class="eyebrow">Ngày Phụ nữ Việt Nam</p>
    <p class="big-date" aria-label="20 tháng 10">20<span class="dot">·</span>10</p>
    <p class="intro-to" id="introTo">Gửi chị</p>
    <p class="intro-line">Em trồng một khu vườn nhỏ, đợi chị mở cổng.</p>
    <button class="btn primary" id="openBtn" type="button">Mở quà</button>
    <p class="intro-note">Bật âm thanh để nghe nhạc</p>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ============================================================
   CONFIG: sửa tên, lời chúc, ảnh, nhạc ở đây
   photo: để trống "" hoặc tên file ảnh đặt cạnh index.html, ví dụ "chi.jpg"
   music: để trống = nhạc tự tạo; hoặc tên file nhạc, ví dụ "nhac.mp3"
   ============================================================ */
const CONFIG = {
  to: "chị",
  message: "Nhân ngày 20 tháng 10, em chúc chị luôn mạnh khoẻ, xinh đẹp và có thật nhiều niềm vui.\nChúc chị và anh Việt luôn có những khoảnh khắc bên nhau ở khắp thế giới :>.\nMong chị lúc nào cũng được thương nhiều như cách chị vẫn thương mọi người nhaaa.",
  from: "Đứa em của chị",
  photo: "anh.jpg",
  music: "nhac.mp3"
};

try{
  const q = new URLSearchParams(location.search);
  if(q.get('to')) CONFIG.to = q.get('to');
  if(q.get('from')) CONFIG.from = q.get('from');
  if(q.get('msg')) CONFIG.message = q.get('msg');
  if(q.get('photo')) CONFIG.photo = q.get('photo');
  if(q.get('music')) CONFIG.music = q.get('music');
}catch(e){}

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
};
const KEY_PHOTO='vuonsen2010:photo';
const data = { to: CONFIG.to, from: CONFIG.from, message: CONFIG.message };
let photoSrc = store.get(KEY_PHOTO) || CONFIG.photo || '';
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = s => document.querySelector(s);
const cardEl=$('#card'), introEl=$('#intro'), hintEl=$('#hint');

/* ---------------- text + photo ---------------- */
function renderText(){
  $('#introTo').textContent = 'Gửi ' + data.to;
  $('#cardTo').textContent = 'Gửi ' + data.to + ',';
  $('#cardFrom').textContent = '— ' + data.from;
}
let typeTimer=null;
function typeMessage(){
  const typed=$('#cardMsg .typed'), rest=$('#cardMsg .rest'), text=data.message;
  clearInterval(typeTimer);
  if(reduceMotion){ typed.textContent=text; rest.textContent=''; return; }
  let i=0; typed.textContent=''; rest.textContent=text;
  typeTimer=setInterval(()=>{
    i+=1; typed.textContent=text.slice(0,i); rest.textContent=text.slice(i);
    if(i>=text.length) clearInterval(typeTimer);
  }, 32);
}
function renderPhoto(){
  const img=$('#photoImg');
  if(photoSrc){ img.src=photoSrc; img.hidden=false; $('#photoEmpty').hidden=true; }
  else { img.removeAttribute('src'); img.hidden=true; $('#photoEmpty').hidden=false; }
}
function readPhoto(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const max=900, s=Math.min(1, max/Math.max(im.naturalWidth, im.naturalHeight));
        const c=document.createElement('canvas');
        c.width=Math.round(im.naturalWidth*s); c.height=Math.round(im.naturalHeight*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.86));
      };
      im.onerror=rej; im.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}
$('#photoInput').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{ photoSrc=await readPhoto(f); store.set(KEY_PHOTO,photoSrc); renderPhoto(); }catch(err){}
});
renderText(); renderPhoto();

/* ---------------- music (WebAudio, original tune in F major) ---------------- */
const BEAT=60/92;
const MEL=[[81,1],[84,1],[81,1],[79,1],[77,2],[79,1],[81,1],[82,1],[81,1],[79,1],[77,1],[79,4],
           [81,1],[84,1],[86,1],[84,1],[81,2],[79,1],[77,1],[79,1],[81,1],[79,1],[76,1],[77,4],
           [86,1],[84,1],[81,1],[77,1],[82,2],[81,1],[79,1],[84,1],[81,1],[79,1],[77,1],[76,2],[79,2],
           [81,1],[84,1],[81,1],[79,1],[77,1],[74,1],[77,1],[81,1],[79,1],[76,1],[72,1],[76,1],[77,4]];
const BASS=[53,53,46,48,53,50,48,53,46,46,53,48,53,50,48,53];
const EVENTS=[]; let beatPos=0;
MEL.forEach(([m,d])=>{ EVENTS.push({b:beatPos,m,d,v:0.19}); beatPos+=d; });
const LOOP_BEATS=beatPos;
BASS.forEach((m,i)=>{ const b=i*4;
  EVENTS.push({b,m,d:2,v:0.11}); EVENTS.push({b:b+1,m:m+7,d:1,v:0.05});
  EVENTS.push({b:b+2,m:m+12,d:1,v:0.05}); EVENTS.push({b:b+3,m:m+7,d:1,v:0.045}); });
EVENTS.sort((a,b)=>a.b-b.b);
let actx=null, master=null, schedTimer=null, loopStart=0, evIdx=0, musicOn=false, musicEl=null, silentEl=null;
function ensureAudio(){
  if(actx) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  actx=new AC(); master=actx.createGain(); master.gain.value=0;
  const delay=actx.createDelay(1); delay.delayTime.value=BEAT*0.5;
  const fb=actx.createGain(); fb.gain.value=0.28;
  const lp=actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2200;
  const wet=actx.createGain(); wet.gain.value=0.3;
  master.connect(actx.destination); master.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(wet); wet.connect(actx.destination);
}
function pluck(m,time,vel,dur){
  const f=440*Math.pow(2,(m-69)/12);
  const o=actx.createOscillator(), o2=actx.createOscillator(), g=actx.createGain(), g2=actx.createGain();
  o.type='triangle'; o.frequency.value=f; o2.type='sine'; o2.frequency.value=f*2.003; g2.gain.value=0.22;
  const tail=Math.max(1.1, dur*BEAT*1.3);
  g.gain.setValueAtTime(0.0001,time); g.gain.exponentialRampToValueAtTime(vel,time+0.012); g.gain.exponentialRampToValueAtTime(0.0001,time+tail);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  o.start(time); o2.start(time); o.stop(time+tail+0.05); o2.stop(time+tail+0.05);
}
function schedule(){
  const ahead=actx.currentTime+0.6;
  for(let guard=0; guard<200; guard++){
    const ev=EVENTS[evIdx], t=loopStart+ev.b*BEAT;
    if(t>ahead) break;
    if(t>=actx.currentTime-0.05) pluck(ev.m,t,ev.v,ev.d);
    evIdx++; if(evIdx>=EVENTS.length){ evIdx=0; loopStart+=LOOP_BEATS*BEAT; }
  }
}
function updateSoundBtn(){ $('#soundLabel').textContent = musicOn ? 'Nhạc: bật' : 'Nhạc: tắt'; $('#soundBtn').setAttribute('aria-pressed', musicOn?'true':'false'); }
// iPhone: Web Audio bị tắt khi bật công tắc im lặng; phát kèm âm thanh rỗng qua <audio> để Safari chuyển sang chế độ phát.
function silentWavUrl(){
  const n=1600, buf=new ArrayBuffer(44+n*2), v=new DataView(buf);
  const w=(o,str)=>{ for(let i=0;i<str.length;i++) v.setUint8(o+i,str.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,1,true); v.setUint32(24,8000,true); v.setUint32(28,16000,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
function unlockPlayback(){
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  try{
    if(!silentEl){ silentEl=new Audio(silentWavUrl()); silentEl.loop=true; silentEl.setAttribute('playsinline',''); }
    const p=silentEl.play(); if(p&&p.catch) p.catch(()=>{});
  }catch(e){}
}
function musicStart(){
  unlockPlayback();
  if(CONFIG.music){
    if(!musicEl){ musicEl=new Audio(CONFIG.music); musicEl.loop=true; musicEl.volume=0.85; musicEl.setAttribute('playsinline',''); }
    musicOn=true; updateSoundBtn();
    const p=musicEl.play(); if(p&&p.catch) p.catch(()=>{ musicOn=false; updateSoundBtn(); });
    return;
  }
  ensureAudio(); if(!actx) return;
  if(actx.resume) actx.resume();
  if(!schedTimer){ loopStart=actx.currentTime+0.15; evIdx=0; schedTimer=setInterval(schedule,120); schedule(); }
  master.gain.cancelScheduledValues(actx.currentTime); master.gain.setTargetAtTime(0.9,actx.currentTime,0.3);
  musicOn=true; updateSoundBtn();
}
function musicStop(){
  if(musicEl) musicEl.pause();
  if(silentEl) silentEl.pause();
  if(actx){ master.gain.cancelScheduledValues(actx.currentTime); master.gain.setTargetAtTime(0,actx.currentTime,0.12); }
  clearInterval(schedTimer); schedTimer=null; musicOn=false; updateSoundBtn();
}
document.addEventListener('visibilitychange',()=>{
  if(!musicOn) return;
  if(document.hidden){ if(musicEl) musicEl.pause(); if(actx&&actx.suspend) actx.suspend(); }
  else { if(musicEl){ const p=musicEl.play(); if(p&&p.catch) p.catch(()=>{}); } if(actx&&actx.resume) actx.resume(); }
});
$('#soundBtn').addEventListener('click', ()=> musicOn ? musicStop() : musicStart());

/* ---------------- 3D scene ---------------- */
let scene3d=null;
try{ if(window.THREE) scene3d = buildScene(); }catch(err){ console.error(err); scene3d=null; }
if(!scene3d){ $('#fallback').hidden=false; }

function buildScene(){
  const canvas=$('#scene');
  const renderer=new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.75));
  const scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0xe9a487, 0.022);
  const camera=new THREE.PerspectiveCamera(45,1,0.05,400);
  const timeU={value:0};
  const C=h=>new THREE.Color(h);
  const rand=Math.random;
  const M4=()=>new THREE.Matrix4();

  /* sky: golden hour */

  function petalGeo(w,h,cup,curl,base,tip,segW,segH){
    const g=new THREE.PlaneGeometry(1,1,segW||6,segH||8);
    const p=g.attributes.position, cols=new Float32Array(p.count*3), tmp=new THREE.Color();
    for(let i=0;i<p.count;i++){

      const prof=Math.sin(Math.PI*(0.1+0.75*v));

      p.setXYZ(i,(u-0.5)*w*prof,y,z);
      tmp.copy(base).lerp(tip,Math.pow(v,0.8));
      const e=Math.abs(xn)*v*0.08;
      cols[i*3]=Math.min(1,tmp.r+e); cols[i*3+1]=Math.min(1,tmp.g+e*0.8); cols[i*3+2]=Math.min(1,tmp.b+e*0.6);

  }

      p.setXYZ(i,(u-0.5)*w*prof, v*h, -v*v*h*0.15);

  function lotusPetalGeo(w,h,cup,base,tip){

      tmp.copy(base).lerp(tip,Math.pow(v,1.8));
      const vein=(1-Math.abs(xn))*0.05;
      cols[i*3]=Math.min(1,tmp.r+vein); cols[i*3+1]=Math.min(1,tmp.g+vein); cols[i*3+2]=Math.min(1,tmp.b+vein);

  function leafGeo(w,h,base,tip){

  function addGeo(acc,geo,m,color){

    if(c){ for(let i=0;i<c.length;i++) acc.col.push(c[i]); }

  }

  function addSway(mat,amp){

      shader.vertexShader='uniform float uTime;\n'+shader.vertexShader.replace('#include <begin_vertex>',
`#include <begin_vertex>
#ifdef USE_INSTANCING
float swPh = instanceMatrix[3].x*0.7 + instanceMatrix[3].z*0.5;
#else
float swPh = 0.0;
#endif
float swY = position.y*position.y;
transformed.x += (sin(uTime*1.3+swPh)+0.4*sin(uTime*2.1+swPh*1.7))*${amp.toFixed(4)}*swY;
transformed.z += cos(uTime*1.1+swPh)*${(amp*0.6).toFixed(4)}*swY;`);
    };
    return mat;
  }

        const pt=st-chickArrive;
        const target=Math.atan2(camera.position.x-chick.g.position.x, camera.position.z-chick.g.position.z);
        let dA=target-chickYaw; while(dA>Math.PI) dA-=Math.PI*2; while(dA<-Math.PI) dA+=Math.PI*2;
        chickYaw+=dA*Math.min(1,dt*3.5); chick.g.rotation.y=chickYaw;
        const lift=easeBack(clamp01((pt-0.5)/0.8));
        const hop=pt>0.5&&pt<1.1?Math.sin(Math.PI*(pt-0.5)/0.6)*0.12:0;
        chick.inner.position.y=hop+Math.sin(clock*2.2)*0.012;
        chick.inner.rotation.z=Math.sin(clock*1.4)*0.05;
        chick.feet[0].position.set(-0.1,0.02,0.09); chick.feet[1].position.set(0.1,0.02,0.09);
        chick.bouquet.position.y=0.27+lift*0.1; chick.bouquet.rotation.x=0.4-lift*0.2;
        chick.wings[0].rotation.set(-0.95-lift*0.45,0,0.3); chick.wings[1].rotation.set(-0.95-lift*0.45,0,-0.3);
        if(!burstDone && pt>0.9){
          burstDone=true; chick.bouquet.getWorldPosition(tmpV);
          for(let i=0;i<6;i++){
            const b=burstPool[i]||addButterfly(tmpV); burstPool[i]=b;
            b.from=tmpV.clone(); b.t=0; b.a=rand()*Math.PI*2; b.s.visible=true;
          }
        }
      }
    }
    if(clock>nextBlink){ const bt=clock-nextBlink; const sc=bt<0.13?0.12:1.15; chick.eyes.forEach(e=>e.scale.y=sc); if(bt>0.13) nextBlink=clock+2.5+rand()*2.5; }

    /* butterflies */
    for(const b of butterflies){
      if(b.from===null && burstPool.includes(b) && !burstDone){ b.s.visible=false; continue; }
      b.a+=b.w*dt; b.t+=dt;
      const ox=b.cx+Math.cos(b.a)*b.R, oz=b.cz+Math.sin(b.a)*b.R*0.7, oy=b.h+Math.sin(clock*1.3+b.ph)*0.2;
      if(b.from){
        const k=easeOut(clamp01(b.t/3));
        b.s.position.set(lerp(b.from.x,ox,k), lerp(b.from.y,oy,k)+Math.sin(k*Math.PI)*0.5, lerp(b.from.z,oz,k));
      } else b.s.position.set(ox,oy,oz);
      const flap=0.25+0.75*Math.abs(Math.sin(clock*b.f+b.ph));
      b.s.scale.set(b.base*flap,b.base,1);
    }

    renderer.render(scene,camera);
  }
  requestAnimationFrame(frame);
  return {start, setCardShown};
}

/* ---------------- flow ---------------- */
let cardTimer=null;
function showCard(){ cardEl.classList.add('show'); if(scene3d) scene3d.setCardShown(true); }
function playStory(){
  clearTimeout(cardTimer);
  if(scene3d) scene3d.start();
  cardTimer=setTimeout(()=>{ showCard(); typeMessage(); $('#polaroid').classList.add('show'); }, scene3d && !reduceMotion ? 4200 : 300);
}
$('#replayBtn').addEventListener('click',()=>{ if(scene3d) scene3d.start(); typeMessage(); });
$('#openBtn').addEventListener('click',()=>{
  introEl.classList.add('gone');
  musicStart();
  playStory();
  setTimeout(()=>{ hintEl.classList.add('show'); setTimeout(()=>hintEl.classList.remove('show'),9000); }, 7000);
});
})();
</script>
